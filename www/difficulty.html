<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Difficulty</title>
  <script src="js/audioManager.js"></script>
  <script src="js/settings.js"></script>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ6H+6p5STpV2W0k1se6AwwU27uj0y1WpB0tmAN37Wl1X2LtqwCw9kDViW5E" crossorigin="anonymous">

  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #b3d8f0, #d6efff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      max-width: 400px;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #222222;
      margin-bottom: 20px;
    }

    .btn {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: white;
    }

    .btn-easy {
      background: linear-gradient(135deg, #a6dcef, #78c4e6);
      box-shadow: 0 4px 8px rgba(120, 196, 230, 0.5);
    }

    .btn-medium {
      background: linear-gradient(135deg, #86c5e0, #6faad2);
      box-shadow: 0 4px 8px rgba(111, 170, 210, 0.5);
    }

    .btn-hard {
      background: linear-gradient(135deg, #5b9fbd, #3c87ab);
      box-shadow: 0 4px 8px rgba(60, 135, 171, 0.5);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    footer {
      font-size: 0.9rem;
      color: #555;
      margin-top: 15px;
    }
  </style>

</head>
<body>

  <div class="container">
    <h1>Select Difficulty</h1>
    <button class="btn btn-easy w-100 my-2" onclick="selectDifficulty('easy')">Easy</button>
    <button class="btn btn-medium w-100 my-2" onclick="selectDifficulty('medium')">Medium</button>
    <button class="btn btn-hard w-100 my-2" onclick="selectDifficulty('hard')">Hard</button>
    <footer>⭐ Make your choice with ease!</footer>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gyb6O9pG7tF2Q5bRd2k5sEKZ5rH6IKW5zFokV0Ds/BO3vYgk2s" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0wZ8FqjQsa6Ymg9rZKr6X5w8PbD8sY7eMbFFNBwbt8A0gXb" crossorigin="anonymous"></script>

  <!-- Custom JS -->

  <script src="js/settings-loader.js"></script>
  <script src="js/difficulty-selection.js"></script>

</body>
</html>
