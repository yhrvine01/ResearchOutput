<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Mode 1</title>

  <script src="js/audioManager.js"></script>
  <script src="js/settings.js"></script>


  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KyZXEJ6H+6p5STpV2W0k1se6AwwU27uj0y1WpB0tmAN37Wl1X2LtqwCw9kDViW5E" crossorigin="anonymous">

  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/game-mode-1.css">

</head>

<body>

  <div id="game-with-question" class="game-container">
    <h2 id="question">Loading question...</h2>
    <ul id="answers">
      <li>1. <span id="answer1">----</span></li>
      <li>2. <span id="answer2">----</span></li>
      <li>3. <span id="answer3">----</span></li>
      <li>4. <span id="answer4">----</span></li>
      <li>5. <span id="answer5">----</span></li>
      <li>6. <span id="answer6">----</span></li>
      <li>7. <span id="answer7">----</span></li>
    </ul>


    <p id="answer-description" style="display: none;"></p>


    <input id="user-input" type="text" placeholder="Type your answer">

    <p id="hints-remaining">Hints Remaining: 3</p>
    <button id="hint-button">Use Hint</button>
    <button id="submit-answer">Submit</button>
    <p id="score">Score: 0</p>
    <p id="highscore">High Score: 0</p>

    <!-- Back to Main Menu Button -->
    <a href="index.html" class="back-button">Back to Main Menu</a>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz4fnFO9gyb6O9pG7tF2Q5bRd2k5sEKZ5rH6IKW5zFokV0Ds/BO3vYgk2s"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
    integrity="sha384-pzjw8f+ua7Kw1TIq0wZ8FqjQsa6Ymg9rZKr6X5w8PbD8sY7eMbFFNBwbt8A0gXb" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="js/settings-loader.js"></script>

  <script src="js/questions.js"></script>
  <script src="js/game-mode-1.js"></script>

  <script>
    // Retrieve level from query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const level = urlParams.get('level');

    // Display level information
    const levelInfo = document.getElementById('question');
    if (level) {
      levelInfo.innerText = `Game Mode 1 - Level ${level}`;
    }
  </script>

</body>

</html>
