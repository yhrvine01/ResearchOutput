<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Mode 2</title>

  <script src="js/audioManager.js"></script>
  <script src="js/settings.js"></script>
  



  <!-- Google Fonts (Poppins for a cute, fun feel) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/game-mode-2.css">

 
</head>

<body>

  <div class="container">
    <h1>Game Mode 2</h1>

    <div id="found-words" class="word-container"></div>

    <div class="input-controls">
      <input id="word-input" type="text" placeholder="Type a word" readonly>
      <div id="letter-buttons" class="letter-container">
        <button class="letter-button">A</button>
        <button class="letter-button">B</button>
        <button class="letter-button">C</button>
        <button class="letter-button">D</button>
        <button class="letter-button">E</button>
        <button class="letter-button">F</button>
        <button class="letter-button">G</button>
      </div>
      <button id="jumble-button">Jumble</button>
      <button id="clear-letter" onclick="clearLastLetter()">Clear Last</button>
      <button id="check-word">Submit</button>
    </div>

    <p id="word-score">Score: 0</p>
    <p id="round">Round: 1</p>

    <div class="control-buttons"></div>

    <button onclick="location.href='index.html'" class="btn-back">Back to Main Menu</button>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gyb6O9pG7tF2Q5bRd2k5sEKZ5rH6IKW5zFokV0Ds/BO3vYgk2s" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0wZ8FqjQsa6Ymg9rZKr6X5w8PbD8sY7eMbFFNBwbt8A0gXb" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="js/settings-loader.js"></script>
  <script src="js/word-bank.js"></script>
  <script src="js/game-mode-2.js"></script>

  <script>
    let score = 0;  // Initialize score
    let round = 1;  // Initialize round

    // Function to increment the score at the start of each round
    function nextRound() {
      score += 10;  // Increase score by 10 each round
      round += 1;   // Increment the round
      updateScoreAndRound();
    }

    // Function to update the score and round display
    function updateScoreAndRound() {
      document.getElementById('word-score').textContent = 'Score: ' + score;
      document.getElementById('round').textContent = 'Round: ' + round;
    }

    // Call nextRound function when ready to move to next round
    nextRound(); // You can call this whenever the user completes a round

  </script>
</body>

</html>
