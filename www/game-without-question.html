<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Mode 2</title>

  <script src="js/audioManager.js"></script>
  <script src="js/settings.js"></script>
  



  <!-- Google Fonts (Poppins for a cute, fun feel) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #B3E5FC, #81D4FA); /* Light baby blue gradient */
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 800px;
      padding: 40px;
      background: linear-gradient(135deg, #ffffff, #E3F2FD); /* White to light blue gradient */
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 3.2rem;
      color: #0288D1; /* Darker blue */
      font-weight: 700;
      margin-bottom: 30px;
      text-transform: uppercase;
      animation: float 3s ease-in-out infinite; /* Floating animation */
    }

    #found-words {
      margin-bottom: 20px;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1.1rem;
    }

    .input-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .input-controls input {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      font-size: 1.2em;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .input-controls button {
      width: 100%;
      max-width: 300px;
      padding: 10px;
      font-size: 1.2em;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      background-color: #0288D1;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .input-controls button:hover {
      background-color: #0277BD;
      transform: scale(1.05); /* Slight button enlargement on hover */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
    }

    .letter-container {
      display: flex;
      justify-content: center;
      gap: 10px; /* Add spacing between buttons */
      margin-bottom: 10px;
      flex-wrap: wrap; /* Ensures buttons wrap on smaller screens */
    }

    .letter-button {
      display: inline-flex; /* Align buttons horizontally */
      justify-content: center;
      align-items: center;
      padding: 10px 20px;
      margin: 5px;
      background-color: #4FC3F7;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      border: none; /* Remove default button border */
      font-size: 1.2em; /* Increase font size for better visibility */
      transition: background-color 0.3s ease;
    }

    .letter-button:hover {
      background-color: #0288D1;
    }

    #word-score,
    #round {
      font-size: 1.2em;
      text-align: center;
    }

    #word-score {
      margin-top: 20px;
    }

    .control-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .btn-back {
      background: linear-gradient(135deg, #81D4FA, #0288D1); /* Blue gradient */
      color: white;
      font-weight: 600;
      padding: 15px 35px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: linear-gradient(135deg, #0288D1, #81D4FA);
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Floating animation for the title */
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Game Mode 2</h1>

    <div id="found-words" class="word-container"></div>

    <div class="input-controls">
      <input id="word-input" type="text" placeholder="Type a word" readonly>
      <div id="letter-buttons" class="letter-container">
        <button class="letter-button">A</button>
        <button class="letter-button">B</button>
        <button class="letter-button">C</button>
        <button class="letter-button">D</button>
        <button class="letter-button">E</button>
        <button class="letter-button">F</button>
        <button class="letter-button">G</button>
      </div>
      <button id="jumble-button">Jumble</button>
      <button id="clear-letter" onclick="clearLastLetter()">Clear Last</button>
      <button id="check-word">Submit</button>
    </div>

    <p id="word-score">Score: 0</p>
    <p id="round">Round: 1</p>

    <div class="control-buttons"></div>

    <button onclick="location.href='index.html'" class="btn-back">Back to Main Menu</button>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gyb6O9pG7tF2Q5bRd2k5sEKZ5rH6IKW5zFokV0Ds/BO3vYgk2s" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0wZ8FqjQsa6Ymg9rZKr6X5w8PbD8sY7eMbFFNBwbt8A0gXb" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="js/settings-loader.js"></script>
  <script src="js/word-bank.js"></script>
  <script src="js/game-mode-2.js"></script>

  <script>
    let score = 0;  // Initialize score
    let round = 1;  // Initialize round

    // Function to increment the score at the start of each round
    function nextRound() {
      score += 10;  // Increase score by 10 each round
      round += 1;   // Increment the round
      updateScoreAndRound();
    }

    // Function to update the score and round display
    function updateScoreAndRound() {
      document.getElementById('word-score').textContent = 'Score: ' + score;
      document.getElementById('round').textContent = 'Round: ' + round;
    }

    // Call nextRound function when ready to move to next round
    nextRound(); // You can call this whenever the user completes a round

  </script>
</body>

</html>
