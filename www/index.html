<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Puzzle Game</title>
  
  <!-- Google Fonts (Poppins for a cute, fun feel) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #B3E5FC, #81D4FA); /* Light baby blue gradient */
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background: linear-gradient(135deg, #ffffff, #E3F2FD); /* White to light blue gradient */
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 3.2rem;
      color: #0288D1; /* Darker blue for contrast */
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      animation: float 3s ease-in-out infinite; /* Floating animation */
    }

    p {
      font-size: 1.2rem;
      color: #546E7A; /* Subtle greyish blue */
      margin-bottom: 30px;
    }

    button {
      font-size: 1.2rem;
      padding: 15px 35px;
      margin-top: 10px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05); /* Slight enlargement */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); /* Deeper shadow */
    }

    .btn-game-mode {
      background: linear-gradient(135deg, #81D4FA, #4FC3F7); /* Baby blue gradient */
      color: white;
      font-weight: 600;
    }

    .btn-game-mode:hover {
      background: linear-gradient(135deg, #4FC3F7, #0288D1); /* Darker blue gradient on hover */
    }

    .btn-settings {
      background: linear-gradient(135deg, #64B5F6, #42A5F5); /* Blue gradient for settings button */
      color: white;
      font-weight: 600;
      margin-top: 15px;
    }

    .btn-settings:hover {
      background: linear-gradient(135deg, #42A5F5, #1E88E5); /* Darker blue gradient on hover */
    }

    /* Floating animation for the title */
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Word Puzzle Game</h1>
    <p>Choose a game mode to get started:</p>
    <div class="d-flex flex-column gap-3">
      <button class="btn btn-lg btn-game-mode" onclick="selectGameMode('with-question')">Game Mode 1</button>
      <button class="btn btn-lg btn-game-mode" onclick="selectGameMode('without-question')">Game Mode 2</button>
      <button class="btn btn-lg btn-settings" onclick="location.href='settings.html'">Settings</button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function selectGameMode(mode) {
      localStorage.setItem('gameMode', mode);
      window.location.href = 'difficulty.html';
    }
  </script>
</body>
</html>
